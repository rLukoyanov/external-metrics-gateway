apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta1.external.metrics.k8s.io
  annotations:
    cert-manager.io/inject-ca-from: external-metrics/external-metrics-gateway-serving-cert
spec:
  group: external.metrics.k8s.io
  version: v1beta1
  groupPriorityMinimum: 100
  versionPriority: 100
  service:
    namespace: external-metrics
    name: external-metrics-gateway
    port: 443
