listenAddr: ":8080"

defaultSource: prometheus

prometheus:
  # Example for Helm release name "prom" from prometheus-community chart.
  url: "http://prom-prometheus-server.monitoring.svc.cluster.local"

keda:
  # Example for Helm release name "keda" from kedacore chart.
  url: "http://keda-operator-metrics-apiserver.keda.svc.cluster.local"

routes:
  - prefix: "prom_"
    source: "prometheus"
    stripPrefix: true
  - prefix: "keda_"
    source: "keda"
    stripPrefix: true
